name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The release step needs write access to create the release and upload assets.
permissions:
  contents: write

jobs:
  binaries:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-latest,    ext: "" }
          - { name: linux-arm64,    os: ubuntu-24.04-arm, ext: "" }
          - { name: macos-arm64,    os: macos-latest,     ext: "" }
          - { name: windows-x86_64, os: windows-latest,   ext: ".exe" }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cargo test --release
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -C target/release -czf "dist/fm-vangogh-${{ matrix.name }}.tar.gz" fm-vangogh
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/fm-vangogh.exe "dist/fm-vangogh-${{ matrix.name }}.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: fm-vangogh-${{ matrix.name }}
          path: dist/*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
